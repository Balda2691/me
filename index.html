<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavori in Corso</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#f59e0b; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at top, #1e3a5f 0%, var(--bg) 70%);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .card { text-align: center; padding: 2.5rem 2rem; max-width: 480px; position: relative; z-index: 1; }
  .icon { font-size: 4rem; display: inline-block; animation: swing 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 1rem 0 .5rem; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  p { color: var(--muted); line-height: 1.6; }
  .bar { margin: 1.8rem auto 0; height: 10px; width: 100%; background: var(--card); border-radius: 999px; overflow: hidden; }
  .bar div { height: 100%; width: 40%; background: linear-gradient(90deg, var(--accent), #fde68a, var(--accent));
             background-size: 200% 100%; border-radius: 999px; animation: load 2.5s ease-in-out infinite, shine 1.5s linear infinite; }
  .dots span { display: inline-block; animation: blink 1.4s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  .footer { margin-top: 1.5rem; font-size: .85rem; color: var(--muted); }
  .spark { position: fixed; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .5;
           animation: float 6s linear infinite; bottom: -10px; }
  .btn { display: inline-block; margin-top: 1.2rem; padding: .6rem 1.3rem; border-radius: 999px;
         background: var(--accent); color: #0f172a; text-decoration: none; font-weight: 600;
         transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }

  @keyframes swing { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @keyframes shine { to { background-position: 200% 0; } }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  @keyframes float { to { transform: translateY(-110vh) scale(.6); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <span class="spark" style="left:10%; animation-delay:0s"></span>
  <span class="spark" style="left:30%; animation-delay:2s"></span>
  <span class="spark" style="left:55%; animation-delay:1s"></span>
  <span class="spark" style="left:80%; animation-delay:3.5s"></span>

  <main class="card">
    <div class="icon">🚧</div>
    <h1>Lavori <span>in Corso</span></h1>
    <p>Il sito è in costruzione.</p>
    <div class="bar"><div></div></div>
    <p class="dots" style="margin-top:1rem">Sto lavorando<span>.</span><span>.</span><span>.</span></p>
    <p class="footer">Torna a trovarmi presto</p>
    <a class="btn" href="https://www.instagram.com/mickybalda91/" target="_blank" rel="noopener">📷 Instagram</a>
  </main>
</body>
</html>
